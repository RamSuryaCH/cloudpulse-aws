name: CloudPulse AI — CI/CD Deploy Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  S3_BUCKET: cloudpulse-app-frontendbucket-arswr5lhouip
  CF_DISTRIBUTION_ID: EJW28095DC509
  LAMBDA_FUNCTION_NAME: cloudpulse-challenge-api

jobs:
  # ── Job 1: Lint + Type-check + Build ─────────────────────────────────────
  build:
    name: 🧪 Build & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check + Vite production build
        run: npm run build

      - name: Package Lambda (zip)
        run: cd backend && zip -r dist/lambda.zip index.js package.json

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

      - name: Upload Lambda zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: backend/dist/lambda.zip
          retention-days: 1

  # ── Job 2: Deploy to AWS (main branch only) ───────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Download Lambda zip
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          path: lambda/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend → Amazon S3
        run: |
          # Sync all assets with long-term caching
          aws s3 sync dist/ s3://$S3_BUCKET/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --region $AWS_REGION

          # index.html — always revalidate
          aws s3 cp dist/index.html s3://$S3_BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --region $AWS_REGION

          echo "✅ Frontend deployed to S3: $S3_BUCKET"

      - name: Update Lambda function → AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --zip-file fileb://lambda/lambda.zip \
            --region $AWS_REGION

          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION_NAME \
            --region $AWS_REGION

          echo "✅ Lambda deployed: $LAMBDA_FUNCTION_NAME"

      - name: Invalidate CloudFront CDN cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION_ID \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "✅ CloudFront invalidation created: $INVALIDATION_ID"
          echo "🌐 Live: https://d1pugni5iia6hw.cloudfront.net"
