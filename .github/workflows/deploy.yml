name: CloudPulse AWS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: 🧪 Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: npm run build

      - name: Package Backend Lambda
        run: |
          cd backend
          zip -r dist/lambda.zip index.js package.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: dist/

  deploy-to-aws:
    name: 🚀 Deploy to AWS (Terraform + S3 + CloudFront)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init & Apply
        run: |
          cd infra/terraform
          terraform init
          terraform apply -auto-approve

      - name: Sync Frontend Assets to S3
        run: |
          BUCKET_NAME=$(terraform -chdir=infra/terraform output -raw s3_bucket_name)
          aws s3 sync dist/ s3://$BUCKET_NAME/ --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html s3://$BUCKET_NAME/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront CDN Cache
        run: |
          CF_DOMAIN=$(terraform -chdir=infra/terraform output -raw cloudfront_domain_name | sed 's|https://||')
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?DomainName=='$CF_DOMAIN'].Id" --output text)
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
            echo "CloudFront cache invalidated for Distribution ID: $DIST_ID"
          fi
